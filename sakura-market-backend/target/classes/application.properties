spring.application.name=sakura-market-backend
server.port=8080

# Conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sakura_market?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate (valida contra nuestro script SQL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración JWT (Clave secreta en Base64 de al menos 256 bits)
jwt.secret=U2FrdXJhTWFya2V0U2VjcmV0S2V5MjAyNkRTeTExMDRFdmFsdWFjaW9uUGFyY2lhbDM=
jwt.expiration=86400000

# Swagger UI accesible en http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
